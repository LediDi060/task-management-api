name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest tests/

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Build image and start services
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify API and email delivery
        shell: bash
        run: |
          api=http://127.0.0.1:8000
          curl -fsS "$api/docs" > /dev/null
          curl -fsS "$api/auth/register" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","name":"CI"}'
          token="$(curl -fsS "$api/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | jq -er '.access_token')"
          task_id="$(curl -fsS "$api/tasks" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{"title":"CI smoke test"}' | jq -er '.id')"
          curl -fsS "$api/tasks/$task_id" -H "Authorization: Bearer $token" \
            | jq -e '.title == "CI smoke test"'
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages \
              | jq -e 'any(.messages[]; any(.To[]; .Address == "ci@example.com"))'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
