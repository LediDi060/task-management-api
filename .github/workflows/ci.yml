name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: pytest tests/

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Install Docker Compose
        shell: bash
        run: |
          compose_dir="$RUNNER_TEMP/compose-bin"
          mkdir -p "$compose_dir"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 \
            -o "$compose_dir/docker-compose"
          echo "dba9d98e1ba5bfe11d88c99b9bd32fc4a0624a30fafe68eea34d61a3e42fd372  $compose_dir/docker-compose" \
            | sha256sum --check -
          chmod +x "$compose_dir/docker-compose"
          echo "$compose_dir" >> "$GITHUB_PATH"
      - name: Build image and start services
        run: docker-compose up -d
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify API and email delivery
        shell: bash
        run: |
          api=http://127.0.0.1:8000
          curl -fsS "$api/docs" > /dev/null
          curl -fsS "$api/auth/register" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","name":"CI"}'
          token="$(curl -fsS "$api/auth/login" \
            --data-urlencode 'username=ci@example.com' \
            --data-urlencode 'password=ci-password-123' | jq -er '.access_token')"
          task_id="$(curl -fsS "$api/tasks" -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d '{"title":"CI smoke test"}' | jq -er '.id')"
          curl -fsS "$api/tasks/$task_id" -H "Authorization: Bearer $token" \
            | jq -e '.title == "CI smoke test"'
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8025/api/v1/messages \
              | jq -e 'any(.messages[]; any(.To[]; .Address == "ci@example.com"))'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Print logs on failure
        if: failure()
        run: docker-compose logs --no-color
      - name: Stop services
        if: always()
        run: docker-compose down -v
