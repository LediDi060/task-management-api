x-app: &app
  image: task-management-api:local
  build: .
  pull_policy: build
  environment:
    DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://tasks:tasks@db:5432/tasks}"
    JWT_SECRET: "${JWT_SECRET:-}"
    JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-30}"
    SMTP_HOST: "${SMTP_HOST:-mailpit}"
    SMTP_PORT: "${SMTP_PORT:-1025}"
    SMTP_FROM: "${SMTP_FROM:-tasks@example.com}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tasks}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 25

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 25

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20

volumes:
  postgres-data:
